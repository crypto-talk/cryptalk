services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cryptalk
      MYSQL_USER: cryptalk
      MYSQL_PASSWORD: cryptalk
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - cryptalk-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/cryptalk?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: cryptalk
      DB_PASSWORD: cryptalk
      JWT_SECRET: ${JWT_SECRET:-change-this-local-secret-to-at-least-32-bytes}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

volumes:
  cryptalk-mysql:
